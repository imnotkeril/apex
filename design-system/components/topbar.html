<!-- @dsCard group="Layout" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Topbar</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-zinc-50 p-6">
  <div class="flex items-center justify-end gap-3 rounded-xl bg-white p-3 shadow-sm ring-1 ring-zinc-100">
    <!-- AI cost with progress -->
    <div class="min-w-[210px] rounded-lg border border-zinc-200 px-3 py-1.5">
      <div class="flex items-center justify-between text-xs">
        <span class="text-zinc-500">AI Cost (Today)</span>
        <span class="font-semibold text-zinc-800">$2.43 / $50.00</span>
        <span class="ml-2 text-[11px] font-medium text-violet-600">4.9%</span>
      </div>
      <div class="mt-1.5 h-1.5 w-full overflow-hidden rounded-full bg-zinc-100">
        <div class="h-full rounded-full bg-violet-500" style="width:4.9%"></div>
      </div>
    </div>

    <!-- date / clock, two-line -->
    <div class="flex items-center gap-2 rounded-lg border border-zinc-200 px-3 py-1.5 text-xs">
      <span class="grid h-7 w-7 place-items-center rounded-md bg-zinc-100 text-zinc-500">▦</span>
      <span class="leading-tight">
        <span class="block font-medium text-zinc-800">May 8, 2025</span>
        <span class="block text-[11px] text-zinc-400">Thursday, 14:35 UTC</span>
      </span>
    </div>

    <!-- org switcher -->
    <button class="flex items-center gap-2 rounded-lg border border-zinc-200 px-2.5 py-1.5 hover:bg-zinc-50">
      <span class="grid h-8 w-8 place-items-center rounded-md bg-rose-200 text-xs font-bold text-rose-700">A</span>
      <span class="leading-tight text-left">
        <span class="block text-sm font-semibold text-zinc-800">Apex Org</span>
        <span class="block text-[10px] text-zinc-400">Team Admin</span>
      </span>
      <span class="text-zinc-400">▾</span>
    </button>
  </div>
</body>
</html>
