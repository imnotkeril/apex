<!-- @dsCard group="Layout" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tabs &amp; Page Header</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-zinc-50 p-8">
  <div class="max-w-4xl space-y-8">
    <!-- page header -->
    <section>
      <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-zinc-400">Page Header</h2>
      <div class="flex items-start justify-between">
        <div>
          <h1 class="text-2xl font-bold uppercase tracking-tight text-zinc-900">Drafts</h1>
          <p class="text-sm text-zinc-500">Create, edit and publish content across multiple formats</p>
        </div>
        <button class="rounded-lg bg-violet-600 px-4 py-2 text-sm font-medium text-white hover:bg-violet-700">+ Create New Draft</button>
      </div>
    </section>

    <!-- pill tabs with counts -->
    <section>
      <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-zinc-400">Tabs (with counts)</h2>
      <div class="flex flex-wrap items-center gap-2">
        <button class="flex items-center gap-2 rounded-lg bg-violet-100 px-3 py-1.5 text-sm font-medium text-violet-700">All Drafts <span class="rounded bg-white/70 px-1.5 text-xs">38</span></button>
        <button class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium text-zinc-500 hover:bg-zinc-100">Draft <span class="rounded bg-zinc-100 px-1.5 text-xs">12</span></button>
        <button class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium text-zinc-500 hover:bg-zinc-100">In Progress <span class="rounded bg-zinc-100 px-1.5 text-xs">6</span></button>
        <button class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium text-zinc-500 hover:bg-zinc-100">Ready <span class="rounded bg-zinc-100 px-1.5 text-xs">9</span></button>
        <button class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium text-zinc-500 hover:bg-zinc-100">Scheduled <span class="rounded bg-zinc-100 px-1.5 text-xs">5</span></button>
        <button class="flex items-center gap-2 rounded-lg px-3 py-1.5 text-sm font-medium text-zinc-500 hover:bg-zinc-100">Published <span class="rounded bg-zinc-100 px-1.5 text-xs">4</span></button>
      </div>
    </section>

    <!-- underline tabs (settings style) -->
    <section>
      <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-zinc-400">Tabs (underline)</h2>
      <div class="flex gap-6 border-b border-zinc-200 text-sm">
        <button class="-mb-px border-b-2 border-violet-600 pb-2 font-medium text-violet-700">General</button>
        <button class="-mb-px border-b-2 border-transparent pb-2 text-zinc-500 hover:text-zinc-800">AI &amp; Generation</button>
        <button class="-mb-px border-b-2 border-transparent pb-2 text-zinc-500 hover:text-zinc-800">Content</button>
        <button class="-mb-px border-b-2 border-transparent pb-2 text-zinc-500 hover:text-zinc-800">Integrations</button>
        <button class="-mb-px border-b-2 border-transparent pb-2 text-zinc-500 hover:text-zinc-800">Billing</button>
      </div>
    </section>

    <!-- progress steps -->
    <section>
      <h2 class="mb-3 text-xs font-semibold uppercase tracking-wider text-zinc-400">Pipeline Progress Steps</h2>
      <div class="flex flex-wrap items-center gap-1 text-xs">
        <span class="inline-flex items-center gap-1 rounded-md bg-emerald-100 px-1.5 py-0.5 font-medium text-emerald-700">✓ Synthesis</span><span class="text-zinc-300">→</span>
        <span class="inline-flex items-center gap-1 rounded-md bg-emerald-100 px-1.5 py-0.5 font-medium text-emerald-700">✓ Styling</span><span class="text-zinc-300">→</span>
        <span class="inline-flex items-center gap-1 rounded-md bg-violet-100 px-1.5 py-0.5 font-medium text-violet-700">◴ Formatting</span><span class="text-zinc-300">→</span>
        <span class="inline-flex items-center gap-1 rounded-md bg-zinc-100 px-1.5 py-0.5 font-medium text-zinc-400">Translation</span><span class="text-zinc-300">→</span>
        <span class="inline-flex items-center gap-1 rounded-md bg-zinc-100 px-1.5 py-0.5 font-medium text-zinc-400">Fact Check</span><span class="text-zinc-300">→</span>
        <span class="inline-flex items-center gap-1 rounded-md bg-zinc-100 px-1.5 py-0.5 font-medium text-zinc-400">Image</span>
      </div>
    </section>
  </div>
</body>
</html>
