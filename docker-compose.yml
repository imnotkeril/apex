services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: apex_postgres
    restart: unless-stopped
    env_file:
      - docker.env
    environment:
      POSTGRES_DB: apex
      POSTGRES_USER: apex_user
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apex_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend
    restart: unless-stopped
    env_file:
      - docker.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_celery_worker
    restart: unless-stopped
    env_file:
      - docker.env
    volumes:
      - ./backend:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4 -Q core,modules

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_celery_beat
    restart: unless-stopped
    env_file:
      - docker.env
    volumes:
      - ./backend:/app
    working_dir: /app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: celery -A app.core.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_frontend
    restart: unless-stopped
    env_file:
      - frontend/.env.docker
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    working_dir: /app
    depends_on:
      - backend
    command: npm run dev

volumes:
  postgres_data:
  redis_data:
