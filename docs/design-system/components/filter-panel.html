<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filter Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>body{font-family:Inter,sans-serif}</style>
</head>
<body class="bg-zinc-50 p-6">
  <aside class="w-72 rounded-xl border border-zinc-200 bg-white p-4 shadow-sm">
    <div class="mb-4 flex items-center justify-between">
      <h3 class="text-xs font-semibold uppercase tracking-wider text-zinc-700">Filters</h3>
      <button class="text-xs font-medium text-violet-600 hover:underline">Clear all</button>
    </div>

    <label class="mb-1.5 block text-xs font-medium text-zinc-500">Search</label>
    <div class="mb-4 flex items-center gap-2 rounded-lg border border-zinc-200 px-2.5 py-2 text-sm text-zinc-400">⌕ <span>Search in posts…</span></div>

    <label class="mb-1.5 block text-xs font-medium text-zinc-500">Sources</label>
    <div class="mb-4 flex items-center justify-between rounded-lg border border-zinc-200 px-2.5 py-2 text-sm text-zinc-600">All Sources <span class="text-zinc-400">▾</span></div>

    <div class="mb-1.5 text-xs font-medium text-zinc-500">Status</div>
    <div class="mb-4 space-y-1.5 text-sm text-zinc-700">
      <label class="flex items-center justify-between"><span class="flex items-center gap-2"><input type="checkbox" class="accent-violet-600" checked> New</span><span class="text-zinc-400">42</span></label>
      <label class="flex items-center justify-between"><span class="flex items-center gap-2"><input type="checkbox" class="accent-violet-600" checked> Analyzed</span><span class="text-zinc-400">68</span></label>
      <label class="flex items-center justify-between"><span class="flex items-center gap-2"><input type="checkbox" class="accent-violet-600"> Used</span><span class="text-zinc-400">14</span></label>
    </div>

    <label class="mb-1.5 block text-xs font-medium text-zinc-500">Date Range</label>
    <div class="mb-4 flex items-center gap-2 text-xs">
      <span class="flex-1 rounded-lg border border-zinc-200 px-2 py-2 text-zinc-600">2025-05-01</span>
      <span class="text-zinc-400">→</span>
      <span class="flex-1 rounded-lg border border-zinc-200 px-2 py-2 text-zinc-600">2025-05-08</span>
    </div>

    <button class="mb-2 w-full rounded-lg bg-violet-600 px-4 py-2 text-sm font-medium text-white hover:bg-violet-700">Apply Filters</button>
    <button class="flex w-full items-center justify-center gap-2 rounded-lg border border-zinc-200 px-4 py-2 text-sm font-medium text-zinc-600 hover:bg-zinc-50">🔖 Save as View</button>
  </aside>
</body>
</html>
